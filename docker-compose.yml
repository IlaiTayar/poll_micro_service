version: "3.9"
services:
  db:
    container_name: "poll_db"
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=main
      - MYSQL_USER=ilai
      - MYSQL_PASSWORD=123456789
      - MYSQL_ROOT_PASSWORD=root_password
    ports:
      - "3309:3306"
    volumes:
      - ./resources/db-migrations:/docker-entrypoint-initdb.d/
    command: --default-authentication-plugin=mysql_native_password
